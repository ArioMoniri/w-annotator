[package]
name = "w-relay"
authors = ["Ariorad Moniri"]
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.0"
edition = "2021"
description = "Room relay for W Annotator: forwards messages between the peers of a room."
publish = false

[lib]
name = "w_relay"
path = "src/lib.rs"

[[bin]]
name = "w-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
base64 = "0.22"
bytes = "1.7"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.2"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
ed25519-dalek = "2"
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["io-util"] }
