name: Check release secrets

# Reports which release secrets are set. It never prints a value.
# Run it by hand before cutting a release.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - name: Which secrets are set
        run: |
          missing=0
          for name in TAURI_SIGNING_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "$(printenv "$name")" ]; then
              echo "set      $name"
            else
              echo "MISSING  $name"
              echo "::error title=Missing secret::$name is not set."
              missing=1
            fi
          done
          exit $missing
      - name: The certificate opens and matches the identity
        if: always() && env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12" \
            || { echo "::error title=APPLE_CERTIFICATE::Not valid base64."; exit 1; }
          security create-keychain -p check "$RUNNER_TEMP/check.keychain"
          security unlock-keychain -p check "$RUNNER_TEMP/check.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/check.keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            || { echo "::error title=APPLE_CERTIFICATE_PASSWORD::The .p12 did not open with this password."; exit 1; }
          found=$(security find-identity -v -p codesigning "$RUNNER_TEMP/check.keychain")
          echo "$found" | sed 's/^ *[0-9]*) [0-9A-F]* /identity: /'
          echo "$found" | grep -qF "\"$APPLE_SIGNING_IDENTITY\"" \
            || { echo "::error title=APPLE_SIGNING_IDENTITY::No certificate in the .p12 has exactly this name."; exit 1; }
          echo "$APPLE_SIGNING_IDENTITY" | grep -q "^Developer ID Application: " \
            || { echo "::error title=APPLE_SIGNING_IDENTITY::This must be a Developer ID Application certificate."; exit 1; }
          echo "$APPLE_SIGNING_IDENTITY" | grep -qF "($APPLE_TEAM_ID)" \
            || { echo "::error title=APPLE_TEAM_ID::The team ID does not match the one in the signing identity."; exit 1; }
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Apple accepts the notarisation login
        if: always() && env.APPLE_ID != '' && env.APPLE_PASSWORD != ''
        run: |
          xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" >/dev/null \
            || { echo "::error title=Apple login::Apple rejected APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID. Use an app-specific password."; exit 1; }
          echo "Notarisation login works."
      - name: The updater key matches the app
        if: always() && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          corepack enable >/dev/null 2>&1 || true
          npm install --no-save --silent @tauri-apps/cli@2
          echo test > "$RUNNER_TEMP/probe.txt"
          npx tauri signer sign "$RUNNER_TEMP/probe.txt" >/dev/null \
            || { echo "::error title=TAURI_SIGNING_PRIVATE_KEY::The key could not sign. Paste the whole key file, and set the password secret only if the key has one."; exit 1; }
          want=$(jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json | base64 --decode | tail -n1)
          have=$(base64 --decode < "$RUNNER_TEMP/probe.txt.sig" | sed -n 2p | base64 --decode | head -c 10 | tail -c 8 | xxd -p)
          key=$(echo "$want" | base64 --decode | head -c 10 | tail -c 8 | xxd -p)
          [ "$have" = "$key" ] \
            || { echo "::error title=Updater key mismatch::This private key does not belong to the public key in src-tauri/tauri.conf.json."; exit 1; }
          echo "Updater key matches."
